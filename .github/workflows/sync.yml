# Hourly sync trigger.
#
# WHY THIS EXISTS: Vercel Hobby allows one cron a day, and one invocation is
# capped at 300s. Measured 2026-10-21, a fully fresh run needs ~424s: ~219s for
# twelve jobs plus ~205s to read 62 live HeyReach campaigns. It does not fit, and
# no amount of budget juggling inside one invocation can make it fit — three jobs
# were finishing `partial` every night because of it.
#
# So the work is unchanged and the SCHEDULE moves here: the same endpoint Vercel
# calls, called more often. Nothing runs on this runner; it is a clock. The lock
# and reaper in lib/sync/runner.js already stop two runs of a job overlapping, so
# an early start or a delayed run is recorded as `blocked`, never a double write.
#
# The Vercel cron in vercel.json stays as a daily backstop for if this is ever
# disabled — GitHub turns scheduled workflows off after 60 days without a commit.
#
# Secrets this needs (Settings → Secrets and variables → Actions):
#   APP_URL       https://<your-app>.vercel.app   (no trailing slash)
#   CRON_SECRET   the same value as the Vercel env var of that name
name: Sync

on:
  schedule:
    # :40 past the hour. Not :00 (when GitHub's scheduler is most congested) and
    # not :20 (when Vercel's own daily cron fires, which would only collide).
    - cron: '40 * * * *'
  workflow_dispatch:

# One sync at a time. A run that overruns holds the next one rather than racing
# it; cancel-in-progress would kill a sync mid-write.
concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger the sync
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          : "${APP_URL:?set the APP_URL secret}"
          : "${CRON_SECRET:?set the CRON_SECRET secret}"

          # --max-time clears the 300s function ceiling with margin. Retries cover
          # a cold start or a transient 502; a real failure just waits an hour.
          #
          # curl's own exit code is captured rather than left to `set -e`: a
          # timeout (28) or a DNS failure (6) would otherwise kill the step with
          # an empty log, which is the one failure mode that must stay legible.
          set +e
          http=$(curl -sS -o response.json -w '%{http_code}' \
            --max-time 330 --retry 2 --retry-delay 15 --retry-all-errors \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/sync")
          rc=$?
          set -e

          if [ "$rc" -ne 0 ]; then
            echo "curl failed, exit ${rc} (28 = timed out, 6 = APP_URL did not resolve)"
            cat response.json 2>/dev/null || true
            exit 1
          fi

          echo "HTTP ${http}"
          # The body says which jobs ran and what they did, so the Actions log is
          # readable without opening the dashboard.
          python3 -m json.tool response.json || cat response.json

          case "$http" in
            200) ;;
            401) echo "::error::401 — CRON_SECRET here does not match Vercel's"; exit 1 ;;
            404) echo "::error::404 — check APP_URL points at the deployed app"; exit 1 ;;
            # Vercel Deployment Protection answers a scheduled caller this way,
            # and the sync would otherwise silently never run.
            403) echo "::error::403 — is Deployment Protection on for this project?"; exit 1 ;;
            *) echo "::error::unexpected HTTP ${http}"; exit 1 ;;
          esac
